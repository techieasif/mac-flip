name: Macdot
options:
  bundleIdPrefix: dev.macdot
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
settings:
  SWIFT_VERSION: "5.0"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  CODE_SIGN_STYLE: Automatic
  APP_GROUP_IDENTIFIER: group.dev.macdot.shared
  GENERATE_INFOPLIST_FILE: NO
targets:
  Macdot:
    type: application
    platform: macOS
    sources:
      - path: MacdotApp
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
    info:
      path: MacdotApp/Info.plist
    entitlements:
      path: MacdotApp/Macdot.entitlements
    dependencies:
      - target: MacdotWidgets
        embed: true
        codeSign: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.macdot.app
      PRODUCT_NAME: Macdot
      INFOPLIST_FILE: MacdotApp/Info.plist
      CODE_SIGN_ENTITLEMENTS: MacdotApp/Macdot.entitlements
      ENABLE_HARDENED_RUNTIME: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      COMBINE_HIDPI_IMAGES: YES
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  MacdotWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: MacdotWidgets
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
    info:
      path: MacdotWidgets/Info.plist
    entitlements:
      path: MacdotWidgets/MacdotWidgets.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.macdot.app.widgets
      PRODUCT_NAME: MacdotWidgets
      INFOPLIST_FILE: MacdotWidgets/Info.plist
      CODE_SIGN_ENTITLEMENTS: MacdotWidgets/MacdotWidgets.entitlements
      SKIP_INSTALL: YES
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
schemes:
  Macdot:
    build:
      targets:
        Macdot: all
        MacdotWidgets: all
    run:
      config: Debug
