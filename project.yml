name: MacFlip
options:
  bundleIdPrefix: dev.macflip
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
settings:
  SWIFT_VERSION: "5.0"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  CODE_SIGN_STYLE: Automatic
  APP_GROUP_IDENTIFIER: group.dev.macflip.shared
  GENERATE_INFOPLIST_FILE: NO
targets:
  MacFlip:
    type: application
    platform: macOS
    sources:
      - path: MacFlipApp
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
    info:
      path: MacFlipApp/Info.plist
    entitlements:
      path: MacFlipApp/MacFlip.entitlements
    dependencies:
      - target: MacFlipWidgets
        embed: true
        codeSign: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.macflip.app
      PRODUCT_NAME: MacFlip
      INFOPLIST_FILE: MacFlipApp/Info.plist
      CODE_SIGN_ENTITLEMENTS: MacFlipApp/MacFlip.entitlements
      ENABLE_HARDENED_RUNTIME: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      COMBINE_HIDPI_IMAGES: YES
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  MacFlipWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: MacFlipWidgets
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
    info:
      path: MacFlipWidgets/Info.plist
    entitlements:
      path: MacFlipWidgets/MacFlipWidgets.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.macflip.app.widgets
      PRODUCT_NAME: MacFlipWidgets
      INFOPLIST_FILE: MacFlipWidgets/Info.plist
      CODE_SIGN_ENTITLEMENTS: MacFlipWidgets/MacFlipWidgets.entitlements
      SKIP_INSTALL: YES
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
schemes:
  MacFlip:
    build:
      targets:
        MacFlip: all
        MacFlipWidgets: all
    run:
      config: Debug
